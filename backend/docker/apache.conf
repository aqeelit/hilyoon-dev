# Allow the project's .htaccess routing and hide server details
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# Never serve these over HTTP, even if Caddy routing changes
<DirectoryMatch "^/var/www/html/(config|sql|scripts|logs|models|utils|ai|automation)/">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(\.|.*\.(md|sql|lock|log)$|test-admin\.php$)">
    Require all denied
</FilesMatch>

ServerTokens Prod
ServerSignature Off
